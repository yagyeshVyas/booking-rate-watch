name: Booking Rate Watch

on:
  schedule:
    # every 5 hours, offset from a random minute to reduce detection patterns
    - cron: '23 0,5,10,15,19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci || npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape + compare + email
        run: node ratewatch.js --config config.json
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Persist rate history
        run: |
          git config user.name "auto"
          git config user.email "auto@users.noreply.github.com"
          git add rates-history.jsonl
          git diff --cached --quiet || git commit -m "rate history $(date -u +%FT%TZ)"
          git push
